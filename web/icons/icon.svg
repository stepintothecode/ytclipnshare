<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- All one red, so it works on light and dark backgrounds. The mask cuts
       gaps around the two bars instead of colouring them differently. -->
  <mask id="bars-cut">
    <rect width="512" height="512" fill="#fff"/>
    <rect x="118" y="62" width="46" height="388" rx="23" fill="#000"/>
    <rect x="348" y="62" width="46" height="388" rx="23" fill="#000"/>
  </mask>
  <rect x="64" y="150" width="384" height="212" rx="52" fill="#ff3d3d" mask="url(#bars-cut)"/>
  <path d="M222 205l86 51-86 51z" fill="#ffffff"/>
  <rect x="128" y="72" width="26" height="368" rx="13" fill="#ff3d3d"/>
  <rect x="358" y="72" width="26" height="368" rx="13" fill="#ff3d3d"/>
</svg>
